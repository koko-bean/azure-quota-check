name: Azure quota verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  quota-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure quota extension
        run: az extension add --name quota --upgrade --yes

      - name: Run quota checks
        shell: pwsh
        run: ./scripts/check-azure-quotas.ps1 -ConfigPath quota-config.json -VerboseOutput

      - name: Upload quota-request artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quota-requests
          path: artifacts/quota-requests/
          if-no-files-found: ignore

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Quota verification failed."
          echo "Check the 'quota-requests' artifact for details."
          exit 1
